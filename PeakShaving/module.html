<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:light dark;--accent:#00bfa9;--border:#cbd5d8}*{box-sizing:border-box}body{font:14px Tahoma,sans-serif;margin:0;background:transparent;color:inherit}main{padding:64px 18px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:18px;font-weight:500;margin:0}.badge{font-size:12px;color:var(--accent)}.summary{display:flex;gap:24px;margin:20px 0 12px;flex-wrap:wrap}.summary span{display:block;font-size:12px;opacity:.65}.summary strong{font-size:19px;font-weight:500}#state{font-size:12px;opacity:.75;margin:0 0 14px}.row{display:flex;align-items:center;gap:12px;padding:8px 0;flex-wrap:wrap}.name{flex:1;min-width:100px}.power{min-width:92px;text-align:right;font-variant-numeric:tabular-nums}.actions{display:flex}.actions button{color:var(--accent);background:transparent;border:1px solid var(--accent);font-size:18px;min-width:34px;height:30px;cursor:pointer}.actions button+button{border-left:0}.actions button.chosen{color:white;background:var(--accent)}.actions button:first-child{border-radius:4px 0 0 4px}.actions button:last-child{border-radius:0 4px 4px 0}.grip{cursor:grab;color:#888}.details{width:100%;font-size:12px;opacity:.85;margin-left:24px}.details label{margin-right:12px}.details input{width:55px}button{font:inherit}button:focus-visible{outline:2px solid currentColor;outline-offset:2px}.move{border:0;background:transparent;color:inherit;cursor:pointer}.empty{opacity:.65}#error{color:#ce3d3d;font-size:12px}
</style>
<main>
<div class="badge" id="active"></div>
<div class="summary"><div><span>Netzbezug</span><strong id="grid"></strong></div><div><span>Zielnetzbezug</span><strong id="target"></strong></div></div>
<p id="state"></p><p id="distribution"></p><div id="battery"></div><div id="loads"></div><p id="error" role="alert"></p>
</main>
<script>
let current=__INITIAL_DATA__;
let dragged=null;
const format=value=>value===null?'—':new Intl.NumberFormat('de-DE',{maximumFractionDigits:2}).format(Number(value)||0)+' '+current.unit;
function act(ident,value){document.getElementById('error').textContent='';try{requestAction(ident,value)}catch(e){document.getElementById('error').textContent='Aktion fehlgeschlagen: '+e.message}}
function reorder(from,to){const order=current.loads.map(x=>x.id);order.splice(to,0,order.splice(from,1)[0]);act('Reorder',JSON.stringify(order))}
function button(text,title,action){const b=document.createElement('button');b.type='button';b.textContent=text;b.title=title;b.setAttribute('aria-label',title);b.onclick=action;return b}
function render(){
 document.getElementById('grid').textContent=format(current.grid);
 document.getElementById('target').textContent=format(current.target);
 document.getElementById('active').textContent=!current.enabled?'Deaktiviert':current.active?'Peak Shaving aktiv':'';
 document.getElementById('state').textContent=current.state||'Wartet auf Messwerte';
 document.getElementById('distribution').textContent=current.distribution==='equal'?'Gleichmäßige Verteilung':'Verteilung nach Reihenfolge';
 const storage=document.getElementById('battery');storage.replaceChildren();if(current.battery){const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.className='name';name.textContent='Batteriespeicher';const state=document.createElement('span');state.textContent=current.battery.state;const power=document.createElement('span');power.className='power';power.textContent=format(current.battery.power);row.append(name,state,power);storage.append(row)}
 const list=document.getElementById('loads');list.replaceChildren();
 if(!current.loads.length){const p=document.createElement('p');p.className='empty';p.textContent='Noch keine Verbraucher hinterlegt';list.append(p)}
 current.loads.forEach((load,index)=>{
  const row=document.createElement('div');row.className='row';
  const grip=document.createElement('span');grip.textContent='☰';grip.className='grip';grip.title='Reihenfolge durch Verschieben ändern';grip.draggable=current.distribution==='priority';grip.ondragstart=()=>dragged=index;
  row.ondragover=e=>e.preventDefault();row.ondrop=e=>{e.preventDefault();if(dragged!==null&&dragged!==index&&current.distribution==='priority')reorder(dragged,index);dragged=null};
  const name=document.createElement('span');name.className='name';name.textContent=load.name;
  const controls=document.createElement('div');controls.className='actions';
  [['Auto','↻','Automatisch'],['On','✓','Aktiv'],['Off','×','Inaktiv']].forEach(([mode,label,title])=>{const b=button(label,title,()=>act('LoadMode_'+load.id,mode));b.classList.toggle('chosen',load.mode===mode);b.setAttribute('aria-pressed',load.mode===mode);controls.append(b)});
  const details=document.createElement('div');details.className='details';details.hidden=true;
  const status=document.createElement('span');status.textContent=load.state||'Wartet auf Regelung';details.append(status);
  if(current.distribution==='priority'){const label=document.createElement('label');label.textContent=' Reihenfolge: ';const input=document.createElement('input');input.type='number';input.min=1;input.step=1;input.value=load.priority;input.onchange=()=>act('LoadPriority_'+load.id,Number(input.value));label.append(input);details.append(label);details.append(button('↑','Nach oben',()=>index>0&&reorder(index,index-1)),button('↓','Nach unten',()=>index<current.loads.length-1&&reorder(index,index+1)))}
  controls.append(button('⚙','Verbraucher-Einstellungen',()=>details.hidden=!details.hidden));
  const power=document.createElement('span');power.className='power';power.textContent=format(load.power);
  row.append(grip,name,controls,power,details);list.append(row);
 });
}
function handleMessage(data){current=typeof data==='string'?JSON.parse(data):data;render()}
render();
</script>
</html>
